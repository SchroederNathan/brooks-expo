name: Deploy to TestFlight

# Push to main ships a build to TestFlight. The expensive part — a full native
# compile — only runs when the native layer actually changed. Fingerprint hashes
# the native inputs (deps, config plugins, app config); if a store build already
# exists for that hash, `repack` swaps the new JS bundle into that binary instead
# of rebuilding it.

on:
  push:
    branches: ['main']
  # Lets `eas workflow:run` trigger this by hand, which is the only way to
  # exercise it before the GitHub repo is connected to the EAS project.
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  fingerprint:
    name: Fingerprint native layer
    type: fingerprint
    # Must match the build profile's environment or the hashes will not line up.
    environment: production

  get_ios_build:
    name: Look for a matching iOS build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      # If an identical-fingerprint build is mid-flight, wait for it rather than
      # starting a second full compile of the same native layer.
      wait_for_in_progress: true

  build_ios:
    name: Build iOS (native changed)
    type: build
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    params:
      platform: ios
      profile: production
      message: ${{ github.commit_message }}

  repack_ios:
    name: Repack iOS (JS only)
    type: repack
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    env:
      SOURCE_BUILD_NUMBER: ${{ needs.get_ios_build.outputs.app_build_version }}
    params:
      build_id: ${{ needs.get_ios_build.outputs.build_id }}
      profile: production
      message: ${{ github.commit_message }}
    hooks:
      # `repack` regenerates Info.plist from the app config and ignores EAS
      # remote versioning. app.json carries no ios.buildNumber, so it wrote the
      # Expo default of 1 and App Store Connect rejected the upload — even
      # though the EAS build record claimed the correct number. Derive the next
      # number from the build being repacked and write it where repack looks.
      after_install_node_modules:
        - name: Pin the repacked build number
          run: |
            export NEXT=$((SOURCE_BUILD_NUMBER + 1))
            node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("app.json","utf8"));c.expo.ios.buildNumber=process.env.NEXT;fs.writeFileSync("app.json",JSON.stringify(c,null,2)+"\n");'
            echo "Repacking $SOURCE_BUILD_NUMBER as build number $NEXT"

  testflight:
    name: Upload to TestFlight
    type: testflight
    # `after`, not `needs`: exactly one of the two jobs above is skipped every
    # run, and a skipped job blocks anything that `needs` it.
    after: [build_ios, repack_ios]
    params:
      build_id: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      profile: production
      changelog: ${{ github.commit_message }}
